# =====================================================================
#  Настройки бота мониторинга вакансий
#  Регулярные выражения пишем в ОДИНАРНЫХ кавычках: '\bjava\b'
#  Регистр не важен, «ё» и «е» считаются одинаковыми.
# =====================================================================

# ---------- Откуда берём источники ----------
excel_path: "1_Поиск_работы_30_дней_IT.xlsx"   # файл лежит рядом с main.py
excel_sheet: "IT-каналы"                        # лист со списком источников
priorities: ["A", "B", "C"]                     # какие приоритеты из таблицы мониторить
extra_telegram_channels: []                     # доп. каналы без правки Excel, например ["python_jobs"]

# ---------- Расписание и актуальность ----------
check_interval_minutes: 30     # как часто проверять источники (в режиме работы без --once)
request_delay_sec: 2           # пауза между запросами, чтобы не нагружать сайты
max_age_days: 14               # посты/вакансии старше этого срока считаем неактуальными
recheck_hours: 12              # как часто перепроверять, что вакансия hh/Habr ещё открыта
recheck_limit: 20              # сколько вакансий перепроверять за один цикл
notify_closed: true            # писать «вакансия закрыта», если вы о ней уже получали уведомление
alert_after_failures: 3        # после стольких неудачных проверок подряд сообщить, что источник сломался
digest_threshold: 5            # если новых вакансий больше — присылать одним списком, а не по одной

telegram:
  pages: 1             # сколько страниц истории канала читать за цикл (≈20 постов на страницу)
  pages_first_run: 3   # на самом первом запуске читаем глубже, чтобы собрать недавние вакансии
  head_chars: 200      # по скольким первым символам поста проверяем ключевые слова («шапка» поста)

hh:
  period_days: 7       # искать вакансии за последние N дней (hh принимает 1, 3, 7, 30)
  pages: 2             # сколько страниц выдачи (по 50 вакансий) читать на каждый запрос
  profiles:
    - name: "Москва"
      params: {area: 1}
    # Удалённые вакансии по всей России. Параметр формата работы у hh менялся —
    # проверьте в адресной строке hh.ru, как называется фильтр «Удалённо», и поправьте:
    # - name: "Удалённо"
    #   params: {area: 113, work_format: "REMOTE"}

habr:
  pages: 1
  locations: ["москва"]   # оставляем вакансии, где в локации есть эти слова...
  allow_remote: true      # ...и все удалённые

# ---------- Поисковые запросы (для hh и Habr Career) ----------
# Это только «широкий невод». Окончательно вакансии отбирает фильтр по названию ниже.
search_queries:
  hh:
    - "python"
    - "backend"
    - "бэкенд"
    - "стажер разработчик"
    - "системный аналитик"
    - "system analyst"
    - "ИТ аналитик"
    - "технический аналитик"
    - "аналитик интеграции"
  habr:
    - "python"
    - "backend"
    - "системный аналитик"
    - "system analyst"
    - "стажер"

# ---------- Фильтр по названию вакансии ----------
# Для hh/Habr проверяется название. Для Telegram — первые head_chars символов поста.

# Сразу отбрасываем (не вакансии разработчика/аналитика)
exclude_always:
  - '(преподавател|репетитор|тьютор|учител)\w*'
  - 'куратор\w*\s+(курс|групп|направлен)'
  - '\btutor\b'
  - '\bteacher\b'

# Отбрасываем «старшие» позиции...
exclude_seniority:
  - '\bsenior\b'
  - '\bsr\b'
  - '\blead\b'
  - 'team\s*lead'
  - 'тимлид'
  - '\bhead\s+of\b'
  - '\bprincipal\b'
  - 'архитектор'
  - '\barchitect\b'
  - 'руководител\w+'
  - '\bmiddle\b'
  - '\bmid\b'
  - 'мидл'
  - '(?:ведущ|старш|главн)\w*\s+(?:\S+\s+){0,2}(?:разработчик|аналитик|программист|инженер|специалист|python|backend|бэкенд)'

# ...если только в названии нет слов, показывающих, что берут начинающих
# (так «Junior/Middle Python» не потеряется)
level_override:
  - 'junior'
  - 'джун'
  - '\bintern\b'
  - 'стаж'
  - 'trainee'
  - 'начинающ'
  - 'без опыта'

tracks:
  dev:
    title: "Python/backend"
    include:
      - 'python'
      - 'питон'
      - 'пайтон'
      - 'back[\s-]?end'
      - 'бэк[\s-]?энд'
      - 'бэкенд'
      - 'бекенд'
      - 'django'
      - 'fastapi'
      - 'flask'
      # «Стажёр-разработчик» без указания стека (как в желаемой должности из резюме)
      - '(?:стажер|intern|trainee)\W+(?:\w+\W+){0,2}(?:разработчик|developer|программист)'
    exclude: []
    # Другие стеки отбрасываем, но только если в названии нет слова Python
    soft_exclude:
      - '\bjava\b'
      - 'javascript|\bjs\b|react|angular|\bvue\b|node\.?js|typescript'
      - 'c#|\.net|dotnet'
      - 'c\+\+'
      - 'php|laravel|bitrix|битрикс'
      - '\bgo\b|golang'
      - 'ruby|rails'
      - 'kotlin|swift|\bios\b|android'
      - '\b1[сc]\b'
      - 'frontend|front-end|фронтенд|фронт-энд'
      - '\bqa\b|тестировщик|тестировани'
      - 'devops|\bsre\b|сисадмин|системный администратор'
      - 'unity|unreal'
    soft_exclude_unless:
      - 'python'
      - 'питон'
      - 'пайтон'

  analyst:
    title: "Системная/IT-аналитика"
    include:
      - 'системн\w*\s+аналитик'
      - 'systems?\s+analyst'
      - '\b(?:it|ит)[\s-]*(?:аналитик|analyst)'
      - 'аналитик\s*[\(/-]?\s*(?:it|ит)\b'
      - 'technical\s+analyst'
      - 'технически\w*\s+аналитик'
      - 'integration\s+analyst'
      - 'аналитик\w*\s+(?:по\s+)?интеграц\w*'
    exclude:
      - 'финансов\w*\s+аналитик'
      - 'маркетинг'
      - 'продуктов\w*\s+аналитик'
      - 'data\s+analyst'
      - 'аналитик\w*\s+данных'
      - '\bbi\b'

# ---------- Признаки закрытой вакансии ----------
# В тексте поста Telegram (регулярные выражения):
closed_markers_telegram:
  - 'вакансия\s+закрыта'
  - 'вакансия\s+не\s+актуальн'
  - 'не\s+актуальн'
  - '#закрыто'
  - '#closed'
  - 'позиция\s+закрыта'
  - 'набор\s+закрыт'
  - 'vacancy\s+closed'
  - 'position\s+(?:is\s+)?closed'
# На страницах hh/Habr (обычный текст, строчными буквами).
# Вакансия считается закрытой только после двух подряд подтверждений.
closed_markers_web:
  - 'вакансия в архиве'
  - 'вакансия закрыта'
